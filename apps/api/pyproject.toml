[project]
name = "finboy-api"
version = "0.1.0"
description = "FinBoy's modular FastAPI backend"
requires-python = ">=3.15,<3.16"
dependencies = [
  "alembic>=1.17,<2",
  "fastapi>=0.115,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.11,<3",
  "sqlalchemy>=2.1,<3",
  "uvicorn[standard]>=0.38,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finboy"]
