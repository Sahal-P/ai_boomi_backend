<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1440" viewBox="0 0 720 1440"><rect width="720" height="1440" fill="#ffffff"/><rect width="720" height="140" fill="#b03a2e"/><text x="40" y="92" font-family="Helvetica, Arial, sans-serif" font-size="44" font-weight="bold" text-anchor="start" fill="#ffffff">Weather update</text><text x="40" y="240" font-family="Helvetica, Arial, sans-serif" font-size="32" font-weight="bold" text-anchor="start" fill="#202124">Heavy rain likely in Kochi tomorrow</text><text x="40" y="320" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="normal" text-anchor="start" fill="#333333">The weather office has issued an orange alert</text><text x="40" y="370" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="normal" text-anchor="start" fill="#333333">for three districts. Schools will stay closed.</text><text x="40" y="420" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="normal" text-anchor="start" fill="#333333">Fishermen are advised not to go to sea.</text><text x="40" y="470" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="normal" text-anchor="start" fill="#333333">Strong winds of up to 50 km/h are expected</text><text x="40" y="520" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="normal" text-anchor="start" fill="#333333">along the coast through the weekend.</text></svg>
