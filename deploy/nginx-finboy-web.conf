# Install only after finboy.io and www.finboy.io certificates exist.
upstream finboy_web {
    include /etc/nginx/snippets/finboy-web-upstream.conf;
    keepalive 16;
}
server {
    listen 443 ssl;
    server_name finboy.io;
    ssl_certificate /etc/letsencrypt/live/finboy.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/finboy.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    error_log /dev/null crit;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location = /api/v1/auth/login {
        limit_req zone=finboy_login burst=5 nodelay;
        limit_req_status 429;
        client_max_body_size 4k;
        add_header Cache-Control no-store always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        include /etc/nginx/snippets/finboy-proxy.conf;
    }
    location ^~ /api/v1/ {
        client_max_body_size 103m;
        add_header Cache-Control no-store always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        include /etc/nginx/snippets/finboy-proxy.conf;
    }
    location ^~ /_next/static/ {
        alias /var/lib/finboy-web/static/;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        access_log off;
    }
    location / {
        proxy_pass http://finboy_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
    }
}
server {
    listen 443 ssl;
    server_name www.finboy.io;
    ssl_certificate /etc/letsencrypt/live/finboy.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/finboy.io/privkey.pem;
    access_log off;
    error_log /dev/null crit;
    return 308 https://finboy.io$request_uri;
}
server {
    listen 80;
    server_name finboy.io www.finboy.io;
    access_log off;
    error_log /dev/null crit;
    location ^~ /.well-known/acme-challenge/ { root /var/www/finboy-acme; }
    location / { return 308 https://finboy.io$request_uri; }
}
