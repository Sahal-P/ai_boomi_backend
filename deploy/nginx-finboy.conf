# Obtain the certificate using a challenge-only HTTP server before enabling this file.
limit_req_zone $binary_remote_addr zone=finboy_login:1m rate=10r/m;
server {
    listen 443 ssl;
    server_name finboy-api.antlegs.in;
    ssl_certificate /etc/letsencrypt/live/finboy-api.antlegs.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/finboy-api.antlegs.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    error_log /dev/null crit;
    client_max_body_size 103m;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location ^~ /.well-known/acme-challenge/ { root /var/www/finboy-acme; }
    location = /api/v1/auth/login {
        limit_req zone=finboy_login burst=5 nodelay;
        limit_req_status 429;
        client_max_body_size 4k;
        include /etc/nginx/snippets/finboy-proxy.conf;
    }
    location ^~ /api/v1/ { include /etc/nginx/snippets/finboy-proxy.conf; }
    location / { return 404; }
}
server {
    listen 80;
    server_name finboy-api.antlegs.in;
    access_log off;
    error_log /dev/null crit;
    location ^~ /.well-known/acme-challenge/ { root /var/www/finboy-acme; }
    location / { return 308 https://finboy-api.antlegs.in$request_uri; }
}
