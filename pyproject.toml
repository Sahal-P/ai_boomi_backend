[project]
name = "finboy-workspace"
version = "0.1.0"
requires-python = ">=3.15,<3.16"
dependencies = ["finboy-api"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/api"]

[tool.uv.sources]
finboy-api = { workspace = true }

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8,<10", "ruff>=0.14,<1"]

[tool.ruff]
target-version = "py315"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["apps/api/tests"]
addopts = "-ra --strict-markers"
markers = ["integration: requires the local PostgreSQL database and applied migrations"]
